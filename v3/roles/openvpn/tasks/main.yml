---
- name: Ensure APT keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian" and ansible_distribution_release != "buster"
  tags: [openvpn]

- name: Download OpenVPN GPG key
  get_url:
    url: https://swupdate.openvpn.net/repos/repo-public.gpg
    dest: /etc/apt/keyrings/openvpn-archive-keyring.asc
    mode: '0644'
    force: true
  when: ansible_os_family == "Debian" and ansible_distribution_release != "buster"
  tags: [openvpn]

- name: Add OpenVPN repository
  deb822_repository:
    name: openvpn
    types: [deb]
    uris: [http://build.openvpn.net/debian/openvpn/stable]
    suites: ['{{ ansible_distribution_release }}']
    components: [main]
    signed_by: /etc/apt/keyrings/openvpn-archive-keyring.asc
    state: present
  when: ansible_os_family == "Debian" and ansible_distribution_release != "buster"
  tags: [openvpn]

- name: Install OpenVPN package
  apt:
    name: openvpn
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  notify: openvpn systemd buster
  tags: [openvpn]

- name: Ensure OpenVPN TLS directory exists
  file:
    path: "{{ openvpn_tls_dir }}"
    state: directory
    mode: '0755'
  tags: [openvpn]

- name: Install TLS material from vault secrets
  copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  loop:
    - { content: "{{ openvpn_ca_cert }}", dest: "{{ openvpn_tls_dir }}/ca.crt", mode: '0644' }
    - { content: "{{ openvpn_server_cert }}", dest: "{{ openvpn_tls_dir }}/server.crt", mode: '0644' }
    - { content: "{{ openvpn_server_key }}", dest: "{{ openvpn_tls_dir }}/server.key", mode: '0400' }
    - { content: "{{ openvpn_dh_params }}", dest: "{{ openvpn_tls_dir }}/dh2048.pem", mode: '0644' }
  no_log: true
  tags: [openvpn]

- name: Deploy OpenVPN server config
  template:
    src: templates/server.conf.j2
    dest: "{{ openvpn_tls_dir }}/server.conf"
    mode: '0644'
  notify: openvpn restart buster
  tags: [openvpn]

- name: Start and enable OpenVPN service
  systemd:
    name: "{{ openvpn_service_name | default('openvpn@server') }}"
    enabled: true
    state: started
  tags: [openvpn]
